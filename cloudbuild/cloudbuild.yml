steps:
  # 1. Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}", "."]

  # 2. Push Docker Image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}"]

  # 3-1. Serving API deploy removed (serving not built yet)

  # 3-2. Deploy Ingest Service to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - gcloud
      - run
      - deploy
      - ${_INGEST_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --timeout=600
      - --set-secrets=GEMINI_API_KEY_FREE=${_SECRET_GEMINI_API_KEY_FREE}:latest
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - --command=python
      - --args=-m,src.ingest.main

substitutions:
  _REGION: us-west1
  _REPO_NAME: briefolio-ingest
  _IMAGE_NAME: briefolio-ingest
  _INGEST_SERVICE_NAME: briefolio-ingest
  _SECRET_GEMINI_API_KEY_FREE: GEMINI_API_KEY_FREE  # Secret Manager secret name

options:
  logging: CLOUD_LOGGING_ONLY
